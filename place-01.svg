<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="suzhou creek walk clay">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer in="o" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="0" fill="#0d2137"/>
  <ellipse cx="400" cy="300" rx="420" ry="320" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <ellipse cx="400" cy="480" rx="380" ry="100" fill="#1a5c6e" opacity="0.95"/>
    <rect x="60" y="300" width="680" height="140" rx="70" fill="#2ec4b6" opacity="0.85"/>
    <ellipse cx="400" cy="360" rx="300" ry="40" fill="#7fdbda" opacity="0.35"/>
    <ellipse cx="160" cy="280" rx="140" ry="70" fill="#3d8b6e" opacity="0.9"/>
    <ellipse cx="640" cy="270" rx="150" ry="80" fill="#2f6f55" opacity="0.85"/>
    <ellipse cx="140" cy="200" rx="50" ry="60" fill="#4caf7a" opacity="1"/>
    <ellipse cx="140" cy="250" rx="18" ry="40" fill="#8b5a3c" opacity="1"/>
    <ellipse cx="660" cy="190" rx="55" ry="65" fill="#5ecf8b" opacity="1"/>
    <ellipse cx="660" cy="250" rx="18" ry="40" fill="#8b5a3c" opacity="1"/>
    <rect x="280" y="250" width="240" height="28" rx="14" fill="#f5e6d3" opacity="1"/>
    <rect x="290" y="220" width="16" height="40" rx="6" fill="#e8d5b7" opacity="1"/>
    <rect x="494" y="220" width="16" height="40" rx="6" fill="#e8d5b7" opacity="1"/>
    <ellipse cx="360" cy="230" rx="23" ry="30" fill="#f8f1f1" opacity="0.95"/>
    <ellipse cx="360" cy="198" rx="17" ry="17" fill="#a7c5eb" opacity="0.98"/>
    <ellipse cx="430" cy="235" rx="22" ry="28" fill="#16c79a" opacity="0.95"/>
    <ellipse cx="430" cy="205" rx="16" ry="16" fill="#f5e6d3" opacity="0.98"/>
    <ellipse cx="220" cy="140" rx="70" ry="28" fill="#ffffff" opacity="0.1"/>
  </g>
  <ellipse cx="400" cy="540" rx="340" ry="48" fill="#000000" opacity="0.28"/>
  <rect width="800" height="600" fill="url(#floor)" pointer-events="none"/>
</svg>
