    <rect x="270" y="410" width="28" height="28" rx="8" fill="#f8f1f1" opacity="1"/>
    <ellipse cx="284" cy="405" rx="16" ry="8" fill="#6f4e37" opacity="0.9"/>
    <ellipse cx="320" cy="440" rx="25" ry="32" fill="#f5e6d3" opacity="0.95"/>
    <ellipse cx="320" cy="406" rx="18" ry="18" fill="#ffd36b" opacity="0.98"/>
