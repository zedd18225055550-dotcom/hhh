    <rect x="280" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
    <rect x="340" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
    <rect x="400" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
    <rect x="460" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
    <rect x="520" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
    <rect x="580" y="150" width="40" height="30" rx="8" fill="#f8f1f1" opacity="0.3"/>
