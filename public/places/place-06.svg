<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="anfu road coffee clay">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer in="o" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="0" fill="#2a1f1a"/>
  <ellipse cx="400" cy="300" rx="420" ry="320" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <rect x="160" y="160" width="480" height="300" rx="32" fill="#c4a484" opacity="1"/>
    <rect x="200" y="200" width="180" height="160" rx="20" fill="#87ceeb" opacity="0.45"/>
    <rect x="420" y="200" width="180" height="160" rx="20" fill="#87ceeb" opacity="0.4"/>
