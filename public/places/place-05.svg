<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="lujiazui skyline clay">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer in="o" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="0" fill="#0f1c3f"/>
  <ellipse cx="400" cy="300" rx="420" ry="320" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <ellipse cx="400" cy="500" rx="380" ry="80" fill="#1a3a5c" opacity="0.95"/>
    <ellipse cx="400" cy="480" rx="300" ry="30" fill="#4a90c2" opacity="0.3"/>
    <rect x="200" y="180" width="36" height="280" rx="12" fill="#c4a484" opacity="1"/>
    <ellipse cx="218" cy="220" rx="50" ry="50" fill="#f8f1f1" opacity="0.95"/>
    <ellipse cx="218" cy="300" rx="70" ry="70" fill="#e94560" opacity="0.9"/>
    <ellipse cx="218" cy="160" rx="28" ry="28" fill="#ffd36b" opacity="0.95"/>
    <rect x="360" y="100" width="50" height="360" rx="10" fill="#a7c5eb" opacity="1"/>
    <rect x="350" y="90" width="70" height="30" rx="12" fill="#f5e6d3" opacity="1"/>
    <rect x="480" y="160" width="70" height="300" rx="14" fill="#87ceeb" opacity="0.85"/>
    <rect x="580" y="200" width="55" height="260" rx="12" fill="#6b8cae" opacity="1"/>
    <rect x="300" y="260" width="45" height="200" rx="10" fill="#5a7a9a" opacity="1"/>
    <rect x="365" y="200" width="40" height="12" rx="4" fill="#ffd36b" opacity="0.8"/>
    <rect x="365" y="280" width="40" height="12" rx="4" fill="#e94560" opacity="0.7"/>
    <ellipse cx="140" cy="440" rx="23" ry="30" fill="#f5e6d3" opacity="0.95"/>
    <ellipse cx="140" cy="408" rx="17" ry="17" fill="#a7c5eb" opacity="0.98"/>
    <ellipse cx="190" cy="450" rx="22" ry="28" fill="#16c79a" opacity="0.95"/>
    <ellipse cx="190" cy="420" rx="16" ry="16" fill="#f8f1f1" opacity="0.98"/>
    <ellipse cx="500" cy="80" rx="100" ry="40" fill="#ffffff" opacity="0.1"/>
  </g>
  <ellipse cx="400" cy="540" rx="340" ry="48" fill="#000000" opacity="0.28"/>
  <rect width="800" height="600" fill="url(#floor)" pointer-events="none"/>
</svg>
