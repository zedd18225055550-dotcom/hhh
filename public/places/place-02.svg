<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="west lake evening clay">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer in="o" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="0" fill="#1b1030"/>
  <ellipse cx="400" cy="300" rx="420" ry="320" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <ellipse cx="400" cy="160" rx="280" ry="100" fill="#ff8c69" opacity="0.45"/>
    <ellipse cx="520" cy="120" rx="80" ry="80" fill="#ffd36b" opacity="0.85"/>
    <ellipse cx="400" cy="420" rx="360" ry="120" fill="#3a4f7a" opacity="0.95"/>
    <ellipse cx="400" cy="400" rx="280" ry="60" fill="#6b8cae" opacity="0.4"/>
    <ellipse cx="400" cy="340" rx="100" ry="40" fill="#2f6f55" opacity="0.9"/>
    <rect x="370" y="220" width="60" height="120" rx="12" fill="#c4a484" opacity="1"/>
    <rect x="350" y="210" width="100" height="24" rx="12" fill="#e94560" opacity="0.9"/>
    <rect x="360" y="180" width="80" height="20" rx="10" fill="#e94560" opacity="0.85"/>
    <ellipse cx="400" cy="165" rx="12" ry="18" fill="#f5e6d3" opacity="1"/>
    <ellipse cx="140" cy="280" rx="70" ry="90" fill="#4caf7a" opacity="0.75"/>
    <ellipse cx="660" cy="300" rx="80" ry="100" fill="#3d8b6e" opacity="0.7"/>
    <ellipse cx="280" cy="360" rx="25" ry="32" fill="#f8f1f1" opacity="0.95"/>
    <ellipse cx="280" cy="326" rx="18" ry="18" fill="#ffd36b" opacity="0.98"/>
    <ellipse cx="300" cy="140" rx="100" ry="35" fill="#ffffff" opacity="0.08"/>
  </g>
  <ellipse cx="400" cy="540" rx="340" ry="48" fill="#000000" opacity="0.28"/>
  <rect width="800" height="600" fill="url(#floor)" pointer-events="none"/>
</svg>
