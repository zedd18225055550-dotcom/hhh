<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="clay desk by window">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer in="o" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="0" fill="#1a1a2e"/>
  <ellipse cx="400" cy="300" rx="420" ry="320" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <rect x="120" y="80" width="560" height="320" rx="28" fill="#2d3a5c" opacity="1"/>
    <rect x="150" y="105" width="240" height="180" rx="18" fill="#87ceeb" opacity="0.55"/>
    <rect x="410" y="105" width="240" height="180" rx="18" fill="#87ceeb" opacity="0.45"/>
    <rect x="150" y="300" width="240" height="70" rx="14" fill="#f5d0a9" opacity="0.35"/>
    <rect x="410" y="300" width="240" height="70" rx="14" fill="#f5d0a9" opacity="0.3"/>
    <rect x="80" y="420" width="640" height="90" rx="28" fill="#c4a484" opacity="1"/>
    <rect x="100" y="400" width="600" height="30" rx="14" fill="#d4b896" opacity="1"/>
    <ellipse cx="180" cy="380" rx="36" ry="18" fill="#e94560" opacity="0.9"/>
    <rect x="168" y="350" width="24" height="40" rx="10" fill="#f5e6d3" opacity="1"/>
    <ellipse cx="180" cy="330" rx="42" ry="28" fill="#ffd36b" opacity="0.95"/>
    <ellipse cx="620" cy="390" rx="40" ry="36" fill="#3d8b6e" opacity="0.95"/>
    <ellipse cx="600" cy="370" rx="22" ry="22" fill="#4caf7a" opacity="0.9"/>
    <ellipse cx="640" cy="365" rx="20" ry="20" fill="#5ecf8b" opacity="0.85"/>
    <rect x="605" y="410" width="30" height="28" rx="8" fill="#c97b63" opacity="1"/>
    <rect x="320" y="390" width="120" height="50" rx="14" fill="#f8f1f1" opacity="1"/>
    <rect x="340" y="400" width="80" height="8" rx="4" fill="#e94560" opacity="0.7"/>
    <rect x="340" y="416" width="60" height="6" rx="3" fill="#a7c5eb" opacity="0.6"/>
    <ellipse cx="280" cy="160" rx="90" ry="40" fill="#ffffff" opacity="0.12"/>
  </g>
  <ellipse cx="400" cy="540" rx="340" ry="48" fill="#000000" opacity="0.28"/>
  <rect width="800" height="600" fill="url(#floor)" pointer-events="none"/>
</svg>
